<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="hi, i am Anggoro">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#2a1a4a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b39ddb"/>
      <stop offset="50%" stop-color="#d1c4e9"/>
      <stop offset="100%" stop-color="#9575cd"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="880" height="200" rx="14"/></clipPath>
  </defs>

  <style>
    .t      { font-family: "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace; }
    .name   { font-size: 30px; font-weight: 700; fill: url(#glow); }
    .sub    { font-size: 14px; fill: #9d8ec4; }

    @keyframes roll   { from { transform: translateX(0);    } to { transform: translateX(-880px); } }
    @keyframes drift  { from { transform: translateX(880px);} to { transform: translateX(-220px); } }
    @keyframes hop    {
      0%, 22%   { transform: translateY(0); }
      30%       { transform: translateY(-34px); }
      38%       { transform: translateY(-46px); }
      48%       { transform: translateY(-34px); }
      58%, 100% { transform: translateY(0); }
    }
    @keyframes step   { 0%,49% { transform: translateY(0); } 50%,100% { transform: translateY(-4px); } }
    @keyframes stepb  { 0%,49% { transform: translateY(-4px); } 50%,100% { transform: translateY(0); } }
    @keyframes blink  { 0%,92% { opacity: 1; } 95% { opacity: .15; } 100% { opacity: 1; } }
    @keyframes twinkle{ 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    @keyframes caret  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .obstacles { animation: roll 4s linear infinite; }
    .ground    { animation: roll 2s linear infinite; }
    .cloud     { animation: drift 14s linear infinite; }
    .cloud2    { animation: drift 20s linear infinite; animation-delay: -7s; }
    .bot       { animation: hop 2s ease-in-out infinite; animation-delay: .77s; }
    .legL      { animation: step .28s steps(1) infinite; }
    .legR      { animation: stepb .28s steps(1) infinite; }
    .eye       { animation: blink 3.4s linear infinite; }
    .star      { animation: twinkle 3s ease-in-out infinite; }
    .s2        { animation-delay: -1s; }
    .s3        { animation-delay: -2s; }
    .cur       { animation: caret 1s steps(1) infinite; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="880" height="200" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#d1c4e9">
      <circle class="star"    cx="120" cy="38"  r="1.8"/>
      <circle class="star s2" cx="300" cy="26"  r="1.4"/>
      <circle class="star s3" cx="470" cy="46"  r="1.6"/>
      <circle class="star s2" cx="660" cy="30"  r="1.3"/>
      <circle class="star"    cx="800" cy="52"  r="1.7"/>
      <circle class="star s3" cx="215" cy="66"  r="1.2"/>
    </g>

    <!-- drifting clouds -->
    <g opacity=".18" fill="#b39ddb">
      <g class="cloud">
        <ellipse cx="0" cy="60" rx="34" ry="11"/>
        <ellipse cx="24" cy="56" rx="22" ry="9"/>
      </g>
      <g class="cloud2">
        <ellipse cx="0" cy="88" rx="28" ry="9"/>
        <ellipse cx="20" cy="84" rx="18" ry="7"/>
      </g>
    </g>

    <!-- title -->
    <text class="t name" x="44" y="74">hi, i'm Anggoro</text>
    <text class="t sub"  x="44" y="102">zero coding background &#183; 100% AI-generated<tspan class="cur" fill="#d1c4e9">_</tspan></text>

    <!-- ground -->
    <line x1="0" y1="164" x2="880" y2="164" stroke="#5e4b8b" stroke-width="2"/>
    <g class="ground" stroke="#7a63ad" stroke-width="2" stroke-linecap="round">
      <line x1="30"  y1="172" x2="66"  y2="172"/>
      <line x1="150" y1="176" x2="172" y2="176"/>
      <line x1="280" y1="172" x2="324" y2="172"/>
      <line x1="430" y1="178" x2="452" y2="178"/>
      <line x1="560" y1="172" x2="604" y2="172"/>
      <line x1="720" y1="176" x2="748" y2="176"/>
      <line x1="910" y1="172" x2="946" y2="172"/>
      <line x1="1030" y1="176" x2="1052" y2="176"/>
      <line x1="1160" y1="172" x2="1204" y2="172"/>
      <line x1="1310" y1="178" x2="1332" y2="178"/>
      <line x1="1440" y1="172" x2="1484" y2="172"/>
      <line x1="1600" y1="176" x2="1628" y2="176"/>
    </g>

    <!-- obstacles: little bug-blocks to hop over -->
    <g class="obstacles">
      <g transform="translate(400 0)" fill="#7e57c2">
        <rect x="0" y="140" width="16" height="24" rx="3"/>
        <rect x="-7" y="148" width="7" height="4" rx="2"/>
        <rect x="16" y="148" width="7" height="4" rx="2"/>
      </g>
      <g transform="translate(840 0)" fill="#7e57c2">
        <rect x="0" y="132" width="16" height="32" rx="3"/>
        <rect x="-7" y="142" width="7" height="4" rx="2"/>
        <rect x="16" y="142" width="7" height="4" rx="2"/>
      </g>
      <g transform="translate(1280 0)" fill="#7e57c2">
        <rect x="0" y="140" width="16" height="24" rx="3"/>
        <rect x="-7" y="148" width="7" height="4" rx="2"/>
        <rect x="16" y="148" width="7" height="4" rx="2"/>
      </g>
      <g transform="translate(1720 0)" fill="#7e57c2">
        <rect x="0" y="132" width="16" height="32" rx="3"/>
        <rect x="-7" y="142" width="7" height="4" rx="2"/>
        <rect x="16" y="142" width="7" height="4" rx="2"/>
      </g>
    </g>

    <!-- the runner: a little bot -->
    <g class="bot">
      <g transform="translate(108 0)">
        <!-- antenna -->
        <line x1="18" y1="112" x2="18" y2="102" stroke="#d1c4e9" stroke-width="2"/>
        <circle cx="18" cy="100" r="3" fill="#e1bee7"/>
        <!-- head / body -->
        <rect x="4" y="112" width="30" height="26" rx="7" fill="#d1c4e9"/>
        <rect x="9" y="119" width="20" height="9" rx="4" fill="#2a1a4a"/>
        <g class="eye" fill="#e1bee7">
          <circle cx="15" cy="123.5" r="2.4"/>
          <circle cx="24" cy="123.5" r="2.4"/>
        </g>
        <!-- arm -->
        <rect x="30" y="126" width="10" height="4" rx="2" fill="#b39ddb"/>
        <!-- legs -->
        <rect class="legL" x="10" y="138" width="6" height="14" rx="3" fill="#b39ddb"/>
        <rect class="legR" x="22" y="138" width="6" height="14" rx="3" fill="#b39ddb"/>
        <!-- feet shadow -->
        <ellipse cx="19" cy="166" rx="16" ry="3" fill="#000" opacity=".25"/>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="878" height="198" rx="14" fill="none" stroke="#5e4b8b" stroke-width="1.5"/>
</svg>
